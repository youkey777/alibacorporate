<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ストアへ移動します | aliba games</title>
  <!--
    中継リンク /go/<ゲーム>/<入口>
    押された回数を GA4 のイベント store_redirect（game・src・os）で数えてから、
    iPhone/iPad は App Store（キャンペーンリンク pt・ct）、Android は Google Play（referrer の utm）、
    それ以外はゲームの紹介ページへ飛ばす。vercel.json の rewrites で /go/ 以下は全部このファイルに来る。
    一度配ったリンクは変えないこと（ゲームの目印・入口の名前を変えない）。
  -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P3XDQHJBQQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    var gaConfig = { send_page_view: false };
    try {
      if (localStorage.getItem('aliba_internal') === '1') gaConfig.traffic_type = 'internal';
    } catch (e) {}
    gtag('config', 'G-P3XDQHJBQQ', gaConfig);
  </script>
  <style>
    body { font-family: "Noto Sans JP", sans-serif; text-align: center; padding: 48px 16px; color: #333; }
    a { color: #e8742a; }
  </style>
</head>
<body>
  <p>移動しています…</p>
  <p id="fallback"><a href="/games/">aliba games のゲーム一覧へ</a></p>
  <script>
  (function () {
    var PT = '129217018';
    var GAMES = {
      minetrail: { ios: '6822429511', android: 'online.aliba.minetrail', page: '/games/minetrail/' },
      underdig:  { ios: '6831712759', android: 'online.aliba.underdig', page: '/games/underdig/' },
      okazu:     { ios: '6809498156', android: 'online.aliba.okazunoibasho', page: '/games/okazu/' },
      karakuri:  { ios: '6816586004', android: 'online.aliba.karakuri', page: '/games/karakuri/' },
      kanji:     { ios: '6811368161', android: 'online.aliba.kanjikumitate', page: '/games/kanji/' }
    };
    // 入口 → utm_medium
    var MEDIUM = {
      ig_ad: 'cpc', ig_post: 'social', tiktok: 'social', yt: 'social', x: 'social', line: 'social',
      blog: 'referral', hp: 'referral', ingame: 'app', from_game: 'app', qr: 'offline'
    };
    // ゲームの中の「ほかのゲーム」ボタン（入口 ingame）は、ストアでなくゲームの一覧へ。どのゲームから来たかを ?from= で渡す。
    // 一覧で選ばれたゲームは /go/<ゲーム>/from_game?from=<元のゲーム> を通ってストアへ（2026-11-16 本人）
    var fromGame = '';
    try {
      fromGame = (new URLSearchParams(location.search).get('from') || '').toLowerCase();
    } catch (e) {}
    if (!/^[a-z0-9_]{1,30}$/.test(fromGame)) fromGame = '';

    var parts = location.pathname.replace(/^\/go\/?/, '').split('/').filter(Boolean);
    var game = (parts[0] || '').toLowerCase();
    var src = (parts[1] || '').toLowerCase();
    if (!/^[a-z0-9_]{1,30}$/.test(src)) src = 'none';
    var g = GAMES[game];

    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    var os = isIOS ? 'ios' : (isAndroid ? 'android' : 'other');

    var dest;
    if (!g) {
      dest = '/games/';
    } else if (src === 'ingame') {
      dest = '/games/?from=' + encodeURIComponent(game);
    } else if (isIOS) {
      dest = 'https://apps.apple.com/app/apple-store/id' + g.ios + '?pt=' + PT + '&ct=' + encodeURIComponent(src) + '&mt=8';
    } else if (isAndroid) {
      var medium = MEDIUM[src] || 'other';
      var ref = 'utm_source=' + src + '&utm_medium=' + medium + '&utm_campaign=' + game;
      dest = 'https://play.google.com/store/apps/details?id=' + g.android + '&referrer=' + encodeURIComponent(ref);
    } else {
      dest = g.page;
    }

    var a = document.querySelector('#fallback a');
    a.href = dest;
    a.textContent = '移動しない場合はこちら';

    var gone = false;
    function go() { if (gone) return; gone = true; location.replace(dest); }

    // 送り終わるのを待ってから飛ばす（最長 1.2 秒。広告ブロック等で送れないときも必ず飛ぶ）
    gtag('event', 'store_redirect', {
      game: g ? game : 'unknown:' + game,
      src: src,
      os: os,
      from_game: fromGame || '(none)',
      transport_type: 'beacon',
      event_callback: go
    });
    setTimeout(go, 1200);
  })();
  </script>
</body>
</html>
